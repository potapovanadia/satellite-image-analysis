# Конфігурація проєкту. Будь-який параметр можна перевизначити з командного
# рядка без зміни цього файлу, наприклад:
#   python -m satimg run --pipeline p1 --set pipeline1.kuwahara.window=7

seed: 42                      # зерно для шуму та k-means (відтворюваність)

data:
  input_dir: data/dataset     # папка з вибіркою (підпапки = класи)
  min_size: 16                # менші зображення пропускаються

output:
  dir: results                # куди зберігати результати
  save_stages: true           # зберігати проміжні результати кожної стадії
  save_noise: [none, gaussian_20]  # для яких умов шуму зберігати картинки

# Умови експерименту: на чистий знімок накладається шум, далі пайплайн
# обробляє зашумлене зображення, а результат порівнюється з чистим.
noise:
  - {name: none, type: none}
  - {name: gaussian_10, type: gaussian, sigma: 10}
  - {name: gaussian_20, type: gaussian, sigma: 20}
  - {name: gaussian_30, type: gaussian, sigma: 30}
  - {name: salt_pepper_5, type: salt_pepper, amount: 0.05}

pipeline1:                    # Кувахара -> HSV -> GLCM -> k-means
  kuwahara:
    window: 3                 # непарне, >= 3 (обґрунтування: docs/parameters.md)
  glcm:
    window: 5                 # розмір ковзного вікна
    levels: 8                 # кількість рівнів сірого
    offsets: [[0, 1], [1, 0], [1, 1], [1, -1]]   # 0, 90, 45, 135 градусів
  kmeans:
    k: 4                      # кількість сегментів
    max_iter: 30
    tol: 1.0e-4
    color_weight: 1.0         # вага колірних ознак
    texture_weight: 0.5       # вага текстурних ознак
    n_init: 3                 # кількість перезапусків k-means

pipeline2:                    # CLAHE -> Кенні -> морфологія -> Хаф
  clahe:
    tiles: [8, 8]             # кількість плиток
    clip_limit: 2.0           # обмеження контрасту
  canny:
    sigma: 1.4                # гаусове згладжування всередині Кенні
    low: 0.1                  # нижній поріг (частка від максимуму градієнта)
    high: 0.25                # верхній поріг
  morphology:
    closing_size: 3           # структурний елемент закриття
    min_size: 30              # мінімальна площа фрагмента контуру
  hough:
    theta_step: 1.0           # крок кута, градуси
    rho_step: 1.0             # крок відстані, пікселі
    threshold: 0.4            # поріг піку (частка від максимуму акумулятора)
    min_votes_frac: 0.75      # мін. голосів = частка від меншої сторони зображення
    num_peaks: 10             # максимальна кількість прямих
    nms_rho: 10               # околиця придушення піків по rho
    nms_theta: 10             # околиця придушення піків по theta
    rho_window: 3             # об'єднання голосів сусідніх rho

# Еталонні сценарії перевірки коректності (критерій C1).
verify:
  real_images_per_class: 4    # скільки реальних знімків кожного класу брати
  thresholds:
    p1_gauss20_psnr_gain: 1.0   # Кувахара має підняти PSNR щонайменше на 1 дБ
    p1_sp5_psnr_gain: 3.0       # для імпульсного шуму — на 3 дБ
    p1_synthetic_iou: 0.85      # IoU сегментації синтетичних областей
    p2_clahe_contrast_gain: 1.2 # CLAHE має збільшити контраст (std) у 1.2+ раза
    p2_clahe_psnr: 15.0         # і не спотворити знімок сильніше, ніж PSNR 15 дБ
    p2_angle_tol: 2.0           # допуск кута прямої, градуси
    p2_rho_tol: 3.0             # допуск відстані прямої, пікселі
    p2_noisy_recall: 0.8        # частка знайдених прямих при шумі sigma=20
